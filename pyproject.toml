[project]
name = "hy3dforge"
version = "0.1.0"
description = "Self-hosted image-to-3D service that routes jobs across Hunyuan3D backends"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
hy3dforge = "hy3dforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pinned rather than left to default: pytest-asyncio warns while this is unset and
# intends to change the default, which would silently alter fixture lifetimes.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Raised by fastapi.testclient importing starlette's client, not by our code. The
    # suggested remedy is to swap the whole HTTP stack for httpx2, which is not worth
    # doing for a test-only deprecation.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated.*",
]
